<title>Closet Studio</title>
<style>
  :root{
    --bg:#f6f3ee; --panel:#fbf9f6; --ink:#2a2623; --mute:#8b8279; --line:#e6e0d8;
    --accent:#9a6b3f; --accent-soft:#f1e6da; --ok:#4f8a5b; --warn:#c08a2b; --bad:#c2523f;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;height:100%;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:grid;grid-template-columns:372px 1fr;height:100vh;height:100dvh}
  #panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:22px 20px 28px}
  #stage{position:relative;min-width:0;overflow:hidden;background:linear-gradient(#efebe5,#dcd6cd)}
  canvas{display:block;width:100%;height:100%;outline:none}
  h1{font:600 22px/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:.2px}
  .sub{color:var(--mute);font-size:12.5px;margin-top:4px}
  section{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  h2{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
  .lbl{font-size:12.5px;font-weight:600;margin:14px 0 7px;display:flex;justify-content:space-between;align-items:baseline}
  .lbl span{font-weight:400;color:var(--mute)}
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:9px;transition:.15s}
  button:hover{border-color:#cfc5b8}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .presets button{padding:10px 6px;text-align:center;font-weight:600;font-size:12.5px}
  .presets small{display:block;font-weight:400;color:var(--mute);font-size:11px;margin-top:2px}
  .seg{display:flex;background:#efeae3;border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:8px;font-size:12.5px;color:#5d554d}
  .seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(60,40,20,.14)}
  .sw{display:flex;gap:9px;flex-wrap:wrap}
  .sw button{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
  .sw button.on{box-shadow:0 0 0 2px var(--accent)}
  .sw.sq button{border-radius:10px;width:46px}
  .tabs{display:flex;gap:6px;margin-bottom:4px}
  .tabs button{flex:1;padding:8px 4px;font-weight:600}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabs small{display:block;font-weight:400;font-size:11px;opacity:.7}
  .strip{display:flex;gap:6px}
  .strip button{flex:1;min-width:0;padding:6px 2px 5px;font-size:10.5px;line-height:1.2;color:#5d554d}
  .strip button svg{width:26px;height:31px;display:block;margin:0 auto 3px}
  .strip button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
  .mods{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .mods button{padding:9px 4px 7px;font-size:11.5px;line-height:1.2}
  .mods button svg{width:34px;height:40px;display:block;margin:0 auto 5px;color:#6d645b}
  .mods button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  .mods button.on svg{color:var(--accent)}
  .step{display:flex;align-items:center;gap:10px}
  .step button{width:30px;height:30px;font-size:16px;line-height:1;padding:0}
  .step b{min-width:16px;text-align:center}
  input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
  .tog{display:flex;justify-content:space-between;align-items:center;padding:7px 0;cursor:pointer}
  .tog input{appearance:none;width:38px;height:22px;border-radius:11px;background:#d9d2c8;position:relative;cursor:pointer;transition:.15s;margin:0}
  .tog input:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .tog input:checked{background:var(--accent)}
  .tog input:checked:after{left:18px}
  .room{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .room label{font-size:12px;color:var(--mute)}
  .room input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-top:2px;background:#fff}
  details summary{cursor:pointer;list-style:none}
  details summary h2{display:inline}
  details summary:after{content:" +";color:var(--mute)}
  details[open] summary:after{content:" –"}
  details[open] summary{margin-bottom:12px}
  .foot{display:flex;gap:8px;margin-top:22px}
  .foot button{flex:1;padding:10px}
  .foot .pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  .note{font-size:12px;color:var(--mute);margin-top:8px}
  #hud{position:absolute;top:16px;right:16px;width:236px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:14px 16px;box-shadow:0 8px 30px rgba(60,40,20,.12)}

  .stat b{font-variant-numeric:tabular-nums}
  .pill{font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;color:#fff;margin-left:6px}
  .msg{font-size:12px;margin-top:8px;padding:7px 9px;border-radius:8px;background:#fbf1e0;color:#7a5a17}
  .msg.bad{background:#fae6e2;color:#8f3525}
  .msg.ok{background:#e7f2e9;color:#33663d}
  #views{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:5px;border-radius:13px;box-shadow:0 8px 30px rgba(60,40,20,.14)}
  #views button{border:0;background:transparent;padding:8px 13px;border-radius:9px;font-size:12.5px;white-space:nowrap}
  #views button:hover{background:#efeae3}
  #views button.on{background:var(--ink);color:#fff}
  #hint{position:absolute;top:18px;left:18px;font-size:12px;color:#6d645b;background:rgba(255,255,255,.6);padding:6px 11px;border-radius:9px}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:40px;text-align:center;color:var(--bad)}
  .ikea{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .ikea button{padding:9px 2px;font-weight:700;font-size:12px;letter-spacing:.5px}
  .ikea small{display:block;font-weight:400;font-size:10px;color:var(--mute);letter-spacing:0;margin-top:1px}
  .ikea button.on{background:var(--ink);color:#fff;border-color:var(--ink)} .ikea button.on small{color:#cfc8bf}
  .icard{margin-top:10px;padding:12px 12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .icard p{margin:0 0 4px;font-size:12.5px;color:#5d554d}
  .icard>button{width:100%;padding:10px;font-size:12.5px}
  .plist{list-style:none;margin:0;padding:0;font-size:12.5px}
  .plist li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
  .plist li:last-child{border:0} .plist b{white-space:nowrap}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
  .links a{flex:1;text-align:center;padding:10px 8px;border:1px solid var(--line);border-radius:9px;color:var(--ink);text-decoration:none;font-weight:600;font-size:12.5px;white-space:nowrap}
  .mnav,.hudsum{display:none}
  .foot button{white-space:nowrap}

  @media (max-width:820px){
    html,body{overflow:hidden;overscroll-behavior:none;position:fixed;inset:0}
    #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
    #stage{order:-1}
    #panel{border-right:0;height:min(46dvh,440px);padding:0 14px calc(20px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0;margin-top:-16px;position:relative;z-index:2;box-shadow:0 -6px 24px rgba(60,40,20,.13);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

    .mnav{display:flex;position:sticky;top:0;z-index:3;background:var(--panel);gap:4px;padding:10px 0 8px}
    .mnav button{flex:1;border:0;background:transparent;min-height:42px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--mute)}
    .mnav button.on{background:var(--ink);color:#fff}
    .mnav .col{flex:0 0 42px;font-size:20px;line-height:1;background:#efeae3;color:var(--ink)}

    .foot{display:none;flex-wrap:wrap} #panel[data-m=details] .foot{display:flex}
    .foot button{min-height:46px}
    .presets{grid-template-columns:1fr}

    .presets small{font-size:13px;margin:0}
    .seg button{min-height:42px;font-size:13px}
    .ikea{grid-template-columns:repeat(2,1fr)} .ikea button{min-height:54px;font-size:14px} .ikea small{font-size:12px}
    .links a{min-height:44px;display:flex;align-items:center;justify-content:center} .icard>button{min-height:44px}
    .sw{gap:11px} .sw button{width:44px;height:44px} .sw.sq button{width:48px}
    .tabs button{min-height:48px}
    .strip button{min-height:58px;font-size:11.5px}
    .mods button{min-height:78px;font-size:12px}
    .step button{width:44px;height:44px;font-size:20px}

    input[type=range]{height:34px}
    .lbl{font-size:13.5px;margin-top:16px}
    #hint{top:auto;bottom:76px;left:8px;right:8px;text-align:center;display:none;background:rgba(42,38,35,.9);color:#fff}
    #hud{top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;width:auto;padding:0;border-radius:13px}
    #hud h2{display:none}
    .hudsum{display:flex;width:100%;border:0;background:transparent;padding:0 12px;min-height:44px;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}
    .hudsum i{font-style:normal;color:var(--mute);font-size:16px}
    .hudbody{display:none;padding:0 12px 12px}
    #hud.open .hudbody{display:block}
    #views{bottom:26px;max-width:calc(100% - 16px);overflow-x:auto}
    #views button{padding:0 11px;min-height:40px;font-size:13px}
  }
</style>

  sel = {wall:h.userData.wall, idx:h.userData.idx}; tab = sel.wall; hover = null; rebuild(); renderPanel();
  if (MOBILE.matches){ msec = 'layout'; document.getElementById('app').classList.remove('min'); renderPanel(); panel.scrollTop = 0; }
  else document.getElementById('layout').scrollIntoView({behavior:'smooth', block:'nearest'});
});

/* ───────────────────────── UI ───────────────────────── */
const panel = document.getElementById('panel'), HINT = document.getElementById('hint').textContent;
function icon(id){
  let s = ''; const L = (x1,y1,x2,y2,w=1.4) => s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${w}"/>`;
  const hang = (y,len) => { L(5,y,35,y,1.8); for (let x=9.5;x<=31;x+=5.3) L(x,y+2.5,x,y+len,3); };
  const sh = (...ys) => ys.forEach(y => L(5,y,35,y));
  const dr = (y0,n,h) => { for (let i=0;i<n;i++){ s += `<rect x="6.5" y="${y0+i*h}" width="27" height="${h-1.8}" rx="1" stroke-width="1.2"/>`; L(17.5,y0+i*h+(h-1.8)/2,22.5,y0+i*h+(h-1.8)/2,1.6); } };
  ({ double:()=>{hang(7,14);hang(26,15);}, long:()=>{sh(9);hang(12,28);}, hangShelves:()=>{hang(7,15);sh(28,34,40);},
     hangDrawers:()=>{hang(7,15);dr(28,2,8.5);}, shelves:()=>sh(9,16,23,30,37), drawers:()=>{sh(10,18);dr(24,3,7);},
     shoes:()=>{ for(let y=9;y<=41;y+=6.4){ L(5,y,35,y,1.1); L(9,y-1.6,15,y-1.6,2.4); L(21,y-1.6,27,y-1.6,2.4);} },
     display:()=>{ L(20,4,20,34,1.1); L(17.5,17,17.5,22,1.8); L(22.5,17,22.5,22,1.8); sh(34); dr(35.5,1,9); s+=`<path d="M8 12l5-6M10 18l8-10" stroke-width="1" opacity=".6"/>`; },
     empty:()=>{} })[id]();
  return `<svg viewBox="0 0 40 48" stroke="currentColor" fill="none" stroke-linecap="round"><rect x="3" y="2" width="34" height="44" rx="2" stroke-width="1.4" ${id==='empty'?'stroke-dasharray="3 3"':''}/>${s}</svg>`;
}
const seg = (k, opts, cur, num) => `<div class="seg">${opts.map(([v,l]) => `<button data-k="${k}" data-v="${v}" ${num?'data-n':''} class="${String(v)===String(cur)?'on':''}">${l}</button>`).join('')}</div>`;
const tog = (k, l) => `<label class="tog">${l}<input type="checkbox" data-k="${k}" ${state[k]?'checked':''}></label>`;
const wallName = {left:'Left wall', back:'Back wall', right:'Right wall'};

function renderPanel(){

  const sizes = S ? `Section widths ${S.widths.map(frac).join(', ')}″ · depth ${S.depths.map(frac).join(' or ')}″ · ${S.heights ? 'height '+S.heights.map(frac).join(' or ')+'″' : S.style==='post' ? 'posts fit ceilings 87 1/4 to 137 3/4″' : 'uprights 78 3/4″ long'}` : '';

    </div>` : '';
  const heightCtl = !S ? `<div class="lbl">Cabinet height <span><output>${state.unitH}</output>″ of ${inch(R.H)}</span></div>
    <input type="range" min="66" max="${Math.floor(R.H)}" step="1" value="${Math.min(state.unitH,R.H)}" data-k="unitH" aria-label="Cabinet height">`
    : S.hRange ? `<div class="lbl">${S.style==='rail'?'Wall rail height':'Top shelf height'} <span><output>${state.unitH}</output>″</span></div>
    <input type="range" min="${S.hRange[0]}" max="${Math.min(S.hRange[1], Math.floor(R.H)-1)}" step="1" value="${state.unitH}" data-k="unitH" aria-label="Height">`
    : `<div class="lbl">${S.name} height</div>${seg('unitH', S.heights.map(v => [v, frac(v)+'″']), state.unitH, true)}`;
  const depthCtl = `<div class="lbl">${S ? S.name+' depth' : 'Cabinet depth'}</div>` + seg(`walls.${tab}.depth`, (S ? S.depths : [12,14,16,20,24]).map(v => [v, frac(v)+'″']), w.depth, true);
  const widthCtl = S && cur != null && S.widths.length > 1 ? `<div class="lbl">Section ${sel.idx+1} width</div><div class="seg">${S.widths.map(v => `<button data-width="${v}" class="${w.widths[sel.idx]===v?'on':''}">${frac(v)}″</button>`).join('')}</div>` : '';
  const parts = S ? [...stats.parts].sort((a,b) => a[0].localeCompare(b[0])) : [];
  const showPrice = n => PRICES[n] && (state.sysColor === Object.keys(S.colors)[0] || n.startsWith('ELVARLI')) ? '$'+PRICES[n]+' each' : '';
  panel.innerHTML = `
  <nav class="mnav">${[['looks','Looks'],['finish','Finishes'],['layout','Layout'],['details','More']].map(([k,l]) => `<button data-msec="${k}" class="${msec===k&&!min?'on':''}">${l}</button>`).join('')}<button class="col" data-min aria-label="${min?'Show':'Hide'} controls">${min?'⌃':'⌄'}</button></nav>
  <h1>Closet Studio</h1>
  <div class="sub">${inch(R.W)} wide · ${inch(R.D)} deep · ${inch(R.H)} high · ${inch(R.doorW)} door${S ? ' · IKEA '+S.name : ''}</div>

  <section class="s-looks"><h2>Start from a look</h2>
    <div class="presets">${Object.entries(PRESETS).map(([id,p]) => `<button data-preset="${id}">${p.label}<small>${p.sub}</small></button>`).join('')}</div>
    <div class="lbl">IKEA systems <span>real sizes, sold at ${STORE.name}</span></div>
    <div class="ikea">${Object.values(SYSTEMS).map(x => `<button data-isys="${x.id}" class="${state.sys===x.id?'on':''}">${x.name}<small>${x.tag}</small></button>`).join('')}</div>
    ${card}
  </section>

  <section class="s-finish"><h2>Finishes</h2>
    ${S ? `<div class="lbl">${S.name} color <span>${S.colors[state.sysColor].name}</span></div>${ikeaSw}
    <div class="note">Only the finishes IKEA lists for ${S.name} are offered here. Switch back to custom cabinetry on the Looks tab for wood, glass and metal choices.</div>` : `
    <div class="lbl">Cabinetry <span>${FINISHES[state.finish].name}</span></div>
    <div class="sw sq">${Object.entries(FINISHES).filter(([,f]) => !f.sys).map(([id,f]) => `<button title="${f.name}" aria-label="${f.name}" data-k="finish" data-v="${id}" class="${state.finish===id?'on':''}" style="background:linear-gradient(100deg,${f.base},${f.light} 55%,${f.base})"></button>`).join('')}</div>
    <div class="lbl">Shelves</div>
    ${seg('shelfMat', [['wood','Wood'],['glass','Clear glass'],['frosted','Frosted glass']], state.shelfMat)}
    <div class="lbl">Display-cabinet doors</div>
    ${seg('doorGlass', [['clear','Clear'],['frosted','Frosted'],['smoked','Smoked']], state.doorGlass)}
    <div class="lbl">Rods &amp; handles <span>${HARDWARE[state.hardware].name}</span></div>
    <div class="sw">${Object.entries(HARDWARE).map(([id,h]) => `<button title="${h.name}" aria-label="${h.name}" data-k="hardware" data-v="${id}" class="${state.hardware===id?'on':''}" style="background:radial-gradient(circle at 30% 30%,#fff8,${h.color} 60%)"></button>`).join('')}</div>`}
    <div class="lbl">Wall paint</div>
    <div class="sw">${Object.entries(WALLS).map(([id,c]) => `<button title="${id}" aria-label="${id} walls" data-k="wall" data-v="${id}" class="${state.wall===id?'on':''}" style="background:${c}"></button>`).join('')}</div>
    <div class="lbl">Floor</div>
    ${seg('floor', Object.entries(FLOORS), state.floor)}
  </section>

  <section id="layout" class="s-layout"><h2>Layout${S ? ' · IKEA '+S.name : ''}</h2>
    <div class="tabs">${['left','back','right'].map(k => `<button data-tab="${k}" class="${tab===k?'on':''}">${wallName[k]}<small>${active(k) ? Math.round(lays[k].L)+'″ run' : 'empty'}</small></button>`).join('')}</div>
    <div class="lbl">Sections <span>${side ? '1 is nearest the door' : 'left to right'} · ${S ? `${inch(lay.L)} of ${inch(lay.avail)} used` : inch(lay.L/w.bays.length)+' each'}</span></div>
    <div class="strip">${w.bays.map((b,i) => `<button data-sel="${i}" class="${sel.wall===tab&&sel.idx===i?'on':''}" title="${MODULES[b]}">${icon(b)}${S ? frac(w.widths[i])+'″' : i+1}</button>`).join('')}</div>
    <div class="lbl">${cur ? `Section ${sel.idx+1} is` : 'Pick a section above'} <span>${cur ? MODULES[cur] : ''}</span></div>
    <div class="mods">${Object.entries(MODULES).filter(([id]) => !S || id !== 'display').map(([id,n]) => `<button data-mod="${id}" class="${cur===id?'on':''}" ${cur && (id==='empty' || allowed(S, w.depth, id)) ? '' : 'disabled style="opacity:.35"'}>${icon(id)}${n}</button>`).join('')}</div>
    ${widthCtl}
    <div class="lbl">Number of sections</div>
    <div class="step"><button data-bays="-1" aria-label="Fewer sections">−</button><b>${w.bays.length}</b><button data-bays="1" aria-label="More sections">+</button></div>
    ${depthCtl}
    ${side ? `<div class="lbl">Start back from door wall <span><output>${w.setback}</output>″</span></div>
    <input type="range" min="0" max="48" step="1" value="${w.setback}" data-k="walls.${tab}.setback" aria-label="Setback from door wall">` : ''}
    ${heightCtl}
    <div class="lbl">Who gets the back corners</div>
    ${seg('corner', [['back','Back wall runs full width'],['sides','Side walls run full depth']], state.corner)}
  </section>

  ${S ? `<section class="s-details"><h2>IKEA parts in this layout</h2>
    <ul class="plist">${parts.map(([n,c]) => `<li><span>${c} × ${n}</span><b>${showPrice(n)}</b></li>`).join('')}</ul>
    <div class="note">Counted from the 3D model as a starting list. Fixings, feet and lighting are not included. A price appears only where that exact size was seen on ikea.com on Nov 16, 2026 (white finish). Confirm everything in IKEA's own planner before ordering.</div>
  </section>` : ''}

  <section class="s-details"><h2>Details</h2>
    ${tog('led','LED shelf lighting')}${tog('items','Show clothes &amp; accessories')}${S ? '' : tog('backing','Wood back panels')}${tog('dims','Room dimensions')}
  </section>

  <section class="s-details"><details><summary><h2>Room measurements</h2></summary>
    <div class="room">${[['W','Width'],['D','Depth'],['H','Ceiling height'],['doorH','Door height'],['doorL','Left of door'],['doorR','Right of door']]
      .map(([k,l]) => `<label>${l} (in)<input type="number" step="0.5" min="1" value="${R[k]}" data-k="room.${k}" data-n></label>`).join('')}</div>
    <div class="note">Left and right are as you stand in the doorway looking in.</div>
  </details></section>

  <div class="foot"><button data-reset>Reset</button><button data-link>Share this design</button><button class="pri" data-shot>Save image</button></div>`;
}
function renderViews(){
  document.getElementById('views').innerHTML = Object.entries(VIEWS).map(([id,v]) => `<button data-view="${id}" class="${activeView===id?'on':''}">${v[0]}</button>`).join('');
}
function renderHud(){
  const R = state.room, e = stats.eff, aisle = R.W - e.left - e.right;
  const pill = aisle >= 30 ? ['comfortable','var(--ok)'] : aisle >= 24 ? ['ok','var(--ok)'] : aisle >= 20 ? ['tight','var(--warn)'] : ['too narrow','var(--bad)'];
  const msgs = [];
  for (const [w, ret] of [['left',R.doorL],['right',R.doorR]]){
    const over = e[w] - ret;
    if (over > .5 && state.walls[w].setback < e[w]*.6) msgs.push(['', `${wallName[w]} sticks ${inch(over)} into the doorway. Start it further back from the door wall or make it shallower.`]);
  }
  if (state.sys) for (const k of ['left','back','right']) if (active(k) && lastLay[k].L > lastLay[k].avail + .5)
    msgs.push(['bad', `${wallName[k]} sections add up to ${inch(lastLay[k].L)}, which is ${inch(lastLay[k].L-lastLay[k].avail)} more than fits. Remove a section or choose narrower ones.`]);
  if (aisle < 24) msgs.push([aisle<20?'bad':'', `Walkway is ${inch(aisle)} with clothes hanging. 24″ or more is easier to move in.`]);
  if (!msgs.length && stats.hang) msgs.push(['ok','Doorway is clear and the walkway is workable.']);
  const ft = v => (v/12).toFixed(1)+' ft';
  const hud = document.getElementById('hud'); hud.classList.toggle('open', hudOpen);
  hud.innerHTML = `<button class="hudsum" aria-expanded="${hudOpen}"><span><b>${ft(stats.hang)}</b> rod · walkway <b>${inch(aisle)}</b><span class="pill" style="background:${pill[1]}">${pill[0]}</span></span><i>${hudOpen?'⌃':'⌄'}</i></button><div class="hudbody"><h2>This layout</h2>
    <div class="stat">Hanging rod <b>${ft(stats.hang)}</b></div>
    <div class="stat">≈ garments <b>${Math.round(stats.hang/1.25)}</b></div>
    <div class="stat">Shelving <b>${ft(stats.shelf)}</b></div>
    <div class="stat">Drawers <b>${stats.drawers}</b></div>
    <div class="stat">Shoe pairs <b>${stats.shoes}</b></div>
    <div class="stat">Walkway <b>${inch(aisle)}<span class="pill" style="background:${pill[1]}">${pill[0]}</span></b></div>
    ${msgs.map(m => `<div class="msg ${m[0]}">${m[1]}</div>`).join('')}</div>`;
}
document.getElementById('hud').addEventListener('click', ev => { if (ev.target.closest('.hudsum')){ hudOpen = !hudOpen; renderHud(); } });
function toast(t){ const el = document.getElementById('hint'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = ''; el.textContent = HINT; }, 2600); }
function setPath(path, v){ const ks = path.split('.'); let o = state; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = v; }

panel.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.msec){ msec = d.msec; document.getElementById('app').classList.remove('min'); renderPanel(); panel.scrollTop = 0; return; }
  if ('min' in d){ document.getElementById('app').classList.toggle('min'); renderPanel(); panel.scrollTop = 0; return; }
  if ('link' in d){
    const url = location.origin + location.pathname + '#d=' + encode();
    if (COARSE && navigator.share) navigator.share({title:'Closet design', url}).catch(()=>{});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link copied. Anyone who opens it sees this exact design.'), () => prompt('Copy this link', url));
    else prompt('Copy this link', url);
    return;
  }
  if (d.preset){ state.sys = null; Object.assign(state, structuredClone(PRESETS[d.preset])); delete state.label; delete state.sub; state.unitH = Math.min(state.unitH, state.room.H); sel = {wall:'left', idx:0}; tab = 'left'; }
  else if (d.tab){ tab = d.tab; sel = {wall:tab, idx:0}; }
  else if (d.sel){ sel = {wall:tab, idx:+d.sel}; }
  else if (d.mod){ state.walls[tab].bays[sel.idx] = d.mod; }
  else if (d.isys){ applySystem(d.isys); sel = {wall:'left', idx:0}; tab = 'left'; }
  else if (d.ilay){ applySystem(state.sys, d.ilay, state.sysColor); sel = {wall:'left', idx:0}; tab = 'left'; }
  else if (d.icol){ state.sysColor = d.icol; }
  else if (d.width){ state.walls[tab].widths[sel.idx] = +d.width; }
  else if ('nosys' in d){ state.sys = null; state.unitH = Math.min(84, Math.floor(state.room.H)); for (const k in state.walls){ const c = state.walls[k]; c.depth = [12,14,16,20,24].reduce((a,b) => Math.abs(b-c.depth) < Math.abs(a-c.depth) ? b : a); } }
  else if (d.bays){ const a = state.walls[tab].bays, max = tab==='back' ? 4 : 6; if (+d.bays > 0 && a.length < max) a.push('shelves'); if (+d.bays < 0 && a.length > 1) a.pop(); }
  else if (d.k){ setPath(d.k, 'n' in d ? +d.v : d.v); if (state.sys === 'elvarli' && d.k.endsWith('depth') && +d.v < 20) state.sysColor = 'white'; }
  else if ('reset' in d){ state = Object.assign({room:{...DEFAULT_ROOM}, items:true, dims:true, backing:true}, structuredClone(PRESETS.boutique)); sel = {wall:'left', idx:0}; tab = 'left'; }
  else if ('shot' in d){
    renderer.render(scene, camera);
    canvas.toBlob(blob => {
      const file = new File([blob], 'closet-design.png', {type:'image/png'});
      if (COARSE && navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:'Closet design'}).catch(()=>{}); return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }, 'image/png');
    return;
  }
  else return;
  rebuild(); renderPanel();
});
panel.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset.k; if (!k) return;
  if (el.type === 'checkbox'){ state[k] = el.checked; if (k === 'dims'){ dimGroup.visible = el.checked; save(); return; } }
  else if (el.type === 'range'){ setPath(k, +el.value); const o = el.previousElementSibling.querySelector('output'); if (o) o.textContent = el.value; }
  else return;
  rebuild();
});
panel.addEventListener('change', ev => {
  const el = ev.target, k = el.dataset.k; if (!k) return;
  if (el.type === 'number'){
    const v = parseFloat(el.value); if (!(v > 0)) { renderPanel(); return; }
    setPath(k, v); const R = state.room;
    if (R.doorL + R.doorR > R.W - 12){ R.doorL = Math.min(R.doorL, (R.W-12)/2); R.doorR = Math.min(R.doorR, (R.W-12)/2); }
    state.unitH = Math.min(state.unitH, Math.floor(R.H));
    rebuild(); renderPanel(); goView(activeView);
  } else if (el.type === 'range') renderPanel();
});
document.getElementById('views').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) goView(b.dataset.view); });

/* ───────────────────────── go ───────────────────────── */
resize(); rebuild(); renderPanel(); goView('left', true); requestAnimationFrame(tick);
window.__closet = {state:()=>state, stats:()=>stats};
</script>
